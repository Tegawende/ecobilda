<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="format-detection" content="telephone=no,address=no,email=no,date=no,url=no">
    <title>{% block title %}Ecobilda{% endblock %}</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style>
        /* Reset */
        body, table, td, p, a, li, blockquote {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }
        img {
            -ms-interpolation-mode: bicubic;
            border: 0;
            outline: none;
            text-decoration: none;
        }
        body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333333;
            background-color: #f1f7f1;
        }

        /* Container */
        .email-container {
            max-width: 580px;
            margin: 0 auto;
        }

        /* Header - eco-primary palette */
        .header-td {
            background-color: #70A771;
            padding: 20px 24px;
            text-align: center;
        }

        /* Content */
        .content-td {
            padding: 32px 28px 24px;
            background-color: #ffffff;
        }
        h1 {
            color: #1a1a1a;
            font-size: 21px;
            font-weight: 700;
            margin: 0 0 18px;
            line-height: 1.3;
        }
        p {
            color: #444444;
            font-size: 15px;
            margin: 0 0 14px;
            line-height: 1.65;
        }
        strong { color: #1a1a1a; }

        /* CTA Button */
        .button-td {
            padding: 24px 0;
            text-align: center;
        }
        .button {
            display: inline-block;
            background-color: #70A771;
            color: #ffffff !important;
            text-decoration: none !important;
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.2px;
            mso-padding-alt: 0;
        }
        /*[if mso]>
        .button { padding: 14px 32px; }
        <![endif]*/

        /* Info box */
        .info-box {
            background-color: #fef9e7;
            border: 1px solid #e8dfa5;
            border-radius: 8px;
            padding: 14px 16px;
            margin: 18px 0;
            font-size: 13px;
            color: #5a5020;
            line-height: 1.5;
        }

        /* Message / quote box */
        .message-box {
            background-color: #f1f7f1;
            border-left: 4px solid #70A771;
            padding: 14px 18px;
            margin: 18px 0;
            border-radius: 0 8px 8px 0;
        }
        .message-box p {
            color: #555555;
            font-style: italic;
            margin: 0;
            font-size: 14px;
        }
        .message-box .label {
            font-style: normal;
            font-weight: 600;
            color: #6b7280;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        /* Rating */
        .rating {
            font-size: 18px;
            font-weight: 700;
            color: #70A771;
            margin-bottom: 6px;
        }

        /* Utilities */
        .text-muted { color: #888888; font-size: 13px; }
        .text-small { font-size: 13px; }
        .fallback-url { word-break: break-all; color: #70A771; font-size: 13px; }
        .closing { margin-top: 24px; }

        /* Footer */
        .footer-td {
            padding: 18px 28px 22px;
            text-align: center;
            background-color: #ffffff;
            border-top: 1px solid #e2ede2;
        }
        .footer-td p {
            color: #999999;
            font-size: 12px;
            margin: 0 0 6px;
        }
        .footer-td a {
            color: #70A771;
            text-decoration: none;
        }
        .footer-links { margin-bottom: 10px; }
        .footer-links a { font-size: 13px; }
        .footer-sep { color: #cccccc; margin: 0 6px; }

        /* ====== MOBILE ====== */
        @media only screen and (max-width: 620px) {
            .email-container {
                width: 100% !important;
                max-width: 100% !important;
            }
            .content-td {
                padding: 24px 20px 18px !important;
            }
            .footer-td {
                padding: 16px 20px 20px !important;
            }
            .header-td {
                padding: 16px 20px !important;
            }
            h1 {
                font-size: 19px !important;
            }
            p {
                font-size: 14px !important;
            }
            .button {
                padding: 13px 24px !important;
                font-size: 14px !important;
                display: block !important;
                width: auto !important;
                text-align: center !important;
            }
            .info-box {
                padding: 12px 14px !important;
                font-size: 12px !important;
            }
            .message-box {
                padding: 12px 14px !important;
            }
            .message-box p {
                font-size: 13px !important;
            }
            .fallback-url {
                font-size: 12px !important;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body { background-color: #1a1a1a !important; }
            .content-td { background-color: #2a2a2a !important; }
            .footer-td { background-color: #2a2a2a !important; border-top-color: #3a3a3a !important; }
            h1 { color: #f0f0f0 !important; }
            p { color: #cccccc !important; }
            strong { color: #f0f0f0 !important; }
            .message-box { background-color: #333333 !important; }
            .message-box p { color: #bbbbbb !important; }
            .info-box { background-color: #3a3520 !important; color: #d4c880 !important; border-color: #5a5020 !important; }
        }
    </style>
</head>
<body>
    <!-- Wrapper -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f7f1;">
        <tr>
            <td align="center" style="padding:24px 12px;">
                <!--[if mso]>
                <table role="presentation" width="580" cellpadding="0" cellspacing="0" border="0" align="center">
                <tr><td>
                <![endif]-->
                <table role="presentation" class="email-container" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:580px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">

                    <!-- HEADER -->
                    <tr>
                        <td class="header-td" bgcolor="#70A771" style="background-color:#70A771;padding:22px 24px;text-align:center;">
                            <img src="https://i.ibb.co/RG91Dq0d/logo-white2.png" alt="Ecobilda" width="180" style="display:inline-block;width:180px;height:auto;">
                        </td>
                    </tr>

                    <!-- CONTENT -->
                    <tr>
                        <td class="content-td" bgcolor="#ffffff" style="background-color:#ffffff;padding:32px 28px 24px;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>

                    <!-- FOOTER -->
                    <tr>
                        <td class="footer-td" bgcolor="#ffffff" style="background-color:#ffffff;padding:18px 28px 22px;text-align:center;border-top:1px solid #e2ede2;">
                            <div class="footer-links">
                                <a href="{{ frontend_url }}">Visiter le site</a>
                                <span class="footer-sep">|</span>
                                <a href="{{ frontend_url }}/settings">G&eacute;rer mes notifications</a>
                            </div>
                            <p>&copy; 2026 Ecobilda. Tous droits r&eacute;serv&eacute;s.</p>
                        </td>
                    </tr>

                </table>
                <!--[if mso]>
                </td></tr></table>
                <![endif]-->
            </td>
        </tr>
    </table>
</body>
</html>
