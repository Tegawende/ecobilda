# ---- Production Docker Compose ----
# Convex self-hosted (official image, SQLite backend) + Next.js frontend
# Admin panel is served as static files by Caddy (see Caddyfile)

services:
  convex-backend:
    image: ghcr.io/get-convex/convex-backend:latest
    container_name: ecobilda-convex
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:3210:3210"
      - "127.0.0.1:3211:3211"
    volumes:
      - convex_data:/convex/data
    environment:
      - CONVEX_CLOUD_ORIGIN=https://convex.ecobilda.org
      - CONVEX_SITE_ORIGIN=https://convex.ecobilda.org
      - APPLICATION_MAX_CONCURRENT_MUTATIONS=16
      - APPLICATION_MAX_CONCURRENT_NODE_ACTIONS=16
      - APPLICATION_MAX_CONCURRENT_QUERIES=16
      - APPLICATION_MAX_CONCURRENT_V8_ACTIONS=16
      - DOCUMENT_RETENTION_DELAY=172800
      - DISABLE_METRICS_ENDPOINT=true
      - RUST_LOG=info
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 10s
      start_period: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CONVEX_URL: https://convex.ecobilda.org
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_APP_NAME: Ecobilda
        NEXT_PUBLIC_DEFAULT_LANGUAGE: en
    container_name: ecobilda-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      convex-backend:
        condition: service_healthy

volumes:
  convex_data:
